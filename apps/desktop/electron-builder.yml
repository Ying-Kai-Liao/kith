# Packaging for macOS (DMG + zip for updates), Linux (AppImage, deb, tar.gz) and Windows (NSIS).
# CI puts the native pieces in place first (see .github/workflows/release-desktop.yml):
#   build/native/kith-serve        the host for this platform (macOS: universal)
#   build/native/kith/             macOS: bin/kith (universal) + share/kith/kernel, as in the release tarball
#   build/native/kith-serve.exe    Windows: the host, and kith-servew-main.exe that runs it at sign-in
#   build/native/kith-speech      macOS on-device speech helper
#   build/native/KithScreen.app   macOS screen helper (Xcode `Screen` target, with cua-driver inside)
#   build/native/cua-driver.exe     Windows: the computer-use driver and its UI Automation helper
beforePack: tools/verify-build.cjs
appId: com.yingkailiao.kith
productName: Kith
copyright: ""
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/account-config.json
    to: account-config.json
  - from: resources/tray
    to: tray
protocols:
  - name: Kith
    schemes: [kith, com.yingkailiao.kith]
# The app's own updates (src/shared/update-feed.ts): electron-updater reads app-update.yml, generated from this block,
# and finds latest-mac.yml on the latest non-prerelease Release of the repo. electron-builder never uploads itself: the
# release workflow runs it with --publish never and attaches the files. Dev builds set publish: null.
publish:
  provider: github
  owner: Ying-Kai-Liao
  repo: kith

mac:
  category: public.app-category.developer-tools
  # The Mac app's Icon Composer icon: Assets.car for macOS 26 (no gray icon frame) plus an icns.
  icon: resources/AppIcon.icon
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # The zip (update feed) takes this name; the DMG sets its own.
  artifactName: kith-macos.${ext}
  # kith-tts is arm64 only and identical in both halves of the universal merge, which @electron/universal
  # refuses unless it is named here.
  x64ArchFiles: Contents/Resources/kith-tts
  hardenedRuntime: true
  # The computer-use driver keeps its maker's Developer ID signature (packaging/cua-driver).
  signIgnore:
    - KithScreen\.app/Contents/Helpers/cua-driver$
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Talk to your bots in a voice call.
    NSSpeechRecognitionUsageDescription: Your words are transcribed on this Mac and sent to your bot as a message.
    # generate_appcast signs the zip only when the app inside names this key (packaging/updates).
    SUPublicEDKey: /WvuKYw0ghkj3ExQbCejTquAcozuP1Llo2k8TIvx0Mc=
  # The host ships inside the Mac app; Linux uses the installed kith-serve (an AppImage's
  # mount path changes every launch, so a service can't point into it).
  extraResources:
    - from: build/native/kith-serve
      to: kith-serve
    # Local voice helper, found next to the host (arm64 only; absent on an Intel build).
    - from: build/native/kith-tts
      to: kith-tts
    # The `kith` command line in the release layout (Resources/kith/bin/kith, share/kith/kernel).
    - from: build/native/kith
      to: kith
    - from: build/native/kith-speech
      to: kith-speech
  extraFiles:
    # Registered with SMAppService.agent when Remote screen is turned on.
    - from: build/native/KithScreen.app
      to: Library/LoginItems/KithScreen.app
    - from: resources/mac/com.yingkailiao.kith.screen.plist
      to: Library/LaunchAgents/com.yingkailiao.kith.screen.plist
  notarize: true
dmg:
  artifactName: kith-macos.dmg
  background: build/dmg-background.tiff
  window: { width: 660, height: 400 }
  iconSize: 128
  iconTextSize: 13
  contents:
    - { x: 170, y: 200, type: file }
    - { x: 490, y: 200, type: link, path: /Applications }

linux:
  category: Development
  icon: resources/icon.png
  executableName: kith
  synopsis: Your coding agents as teammates
  # Required by the deb target (package.json has no author email).
  maintainer: Ying-Kai Liao <Ying-Kai-Liao@users.noreply.github.com>
  target: [AppImage, deb, tar.gz]
  artifactName: kith-linux-${env.KITH_LINUX_ARCH}.${ext}
  desktop:
    entry:
      StartupWMClass: Kith
# Fixed, version-free names with one arch spelling (${arch} would give x86_64 for the AppImage and amd64 for the deb);
# the release workflow sets KITH_LINUX_ARCH to x64 or arm64.
appImage:
  artifactName: kith-linux-${env.KITH_LINUX_ARCH}.${ext}
deb:
  artifactName: kith-linux-${env.KITH_LINUX_ARCH}.${ext}

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: x64
  artifactName: kith-windows-x64.${ext}
  # The host ships inside the app, as on macOS: a per-user install keeps its path stable for
  # the sign-in entry that starts it.
  extraResources:
    - from: build/native/kith-serve.exe
      to: kith-serve.exe
    - from: build/native/kith-servew-main.exe
      to: kith-servew-main.exe
    # The computer-use driver bots act through; the host starts it from beside itself.
    - from: build/native/cua-driver.exe
      to: cua-driver.exe
    - from: build/native/cua-driver-uia.exe
      to: cua-driver-uia.exe
    - from: build/native/cua-driver.LICENSE
      to: cua-driver.LICENSE
    # The tray icon (template glyphs are for macOS).
    - from: resources/icon.png
      to: icon.png
nsis:
  oneClick: true
  perMachine: false
