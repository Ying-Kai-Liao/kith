# Overrides applied by tools/dev-builder.cjs (arrays replace, never merge).
appId: com.yingkailiao.kith.dev
productName: Kith Dev
# Linux package managers and Windows installer caches also key on package.json's name.
extraMetadata:
  name: kith-desktop-dev
  productName: Kith Dev
  desktopName: kith-dev.desktop
protocols:
  - name: Kith Dev
    schemes: [kith-dev, com.yingkailiao.kith.dev]
publish: null
mac:
  # Kith Dev only runs on the Mac that built it: an app folder for its architecture, signed
  # without Apple's timestamp server (one round trip per file, about 5 minutes a build; only
  # notarized builds need it).
  target: [dir]
  timestamp: none
  signIgnore:
    - KithDevScreen\.app/Contents/Helpers/cua-driver$
  artifactName: kith-dev-macos.${ext}
  notarize: false
  extraFiles:
    - from: build/native/KithDevScreen.app
      to: Library/LoginItems/KithDevScreen.app
    - from: resources/mac/com.yingkailiao.kith.dev.screen.plist
      to: Library/LaunchAgents/com.yingkailiao.kith.dev.screen.plist
dmg:
  artifactName: kith-dev-macos.dmg
linux:
  executableName: kith-dev
  artifactName: kith-dev-linux-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: Kith Dev
appImage:
  artifactName: kith-dev-linux-${arch}.${ext}
deb:
  artifactName: kith-dev-linux-${arch}.${ext}
win:
  artifactName: kith-dev-windows-x64.${ext}
  extraResources:
    - from: build/native/kith-serve.exe
      to: kith-serve.exe
    - from: build/native/kith-servew.exe
      to: kith-servew.exe
    - from: build/native/cua-driver.exe
      to: cua-driver.exe
    - from: build/native/cua-driver-uia.exe
      to: cua-driver-uia.exe
    - from: build/native/cua-driver.LICENSE
      to: cua-driver.LICENSE
    - from: resources/icon.png
      to: icon.png
