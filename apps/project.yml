# Generate the Xcode project with: xcodegen generate --spec apps/project.yml
name: Kith
options:
  bundleIdPrefix: com.yingkailiao
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.5.6
  KithKit:
    path: ios/Kit
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
configs:
  Debug: debug
  Release: release
  DevDebug: debug
  DevRelease: release
settings:
  base:
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 24
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: T6DWQUSF55
    # A free Personal Team cannot sign Push, Sign in with Apple or communication notifications.
    # KITH_PERSONAL_TEAM=YES swaps the iOS app to iOS.personal.entitlements without them.
    KITH_PERSONAL_TEAM: "NO"
    KITH_ENTITLEMENTS_SUFFIX_NO: ""
    KITH_ENTITLEMENTS_SUFFIX_YES: .personal
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    KITH_ENV: main
    KITH_APP_NAME: Kith
    KITH_IOS_BUNDLE_ID: com.yingkailiao.kith.ios
    KITH_APP_GROUP: group.com.yingkailiao.kith
    KITH_KEYCHAIN_GROUP: com.yingkailiao.kith
    KITH_URL_SCHEME: kith
    KITH_LEGACY_URL_SCHEME: codync
    # The APNs push relay's host (serve/relay). kith-relay is ready to take over once it has a public URL and
    # the APNs key (paid Apple program): set its host here; phones re-register with it on their next launch.
    KITH_PUSH_RELAY_HOST: kith-relay.lykevin890919.workers.dev
    KITH_SCREEN_NAME: KithScreen
    KITH_SCREEN_BUNDLE_ID: com.yingkailiao.kith.screen
    KITH_DATA_FOLDER: .kith/serve-main
  configs:
    Debug:
      KITH_APNS_ENVIRONMENT: sandbox
    Release:
      KITH_APNS_ENVIRONMENT: production
    DevDebug:
      KITH_ENV: dev
      KITH_APP_NAME: Kith
      KITH_IOS_BUNDLE_ID: com.yingkailiao.kith.ios.dev
      KITH_APP_GROUP: group.com.yingkailiao.kith.dev
      KITH_KEYCHAIN_GROUP: com.yingkailiao.kith.dev
      KITH_URL_SCHEME: kith-dev
      KITH_LEGACY_URL_SCHEME: codync-dev
      KITH_SCREEN_NAME: KithDevScreen
      KITH_SCREEN_BUNDLE_ID: com.yingkailiao.kith.dev.screen
      KITH_DATA_FOLDER: .kith/serve
      KITH_APNS_ENVIRONMENT: sandbox
    DevRelease:
      KITH_ENV: dev
      KITH_APP_NAME: Kith
      KITH_IOS_BUNDLE_ID: com.yingkailiao.kith.ios.dev
      KITH_APP_GROUP: group.com.yingkailiao.kith.dev
      KITH_KEYCHAIN_GROUP: com.yingkailiao.kith.dev
      KITH_URL_SCHEME: kith-dev
      KITH_LEGACY_URL_SCHEME: codync-dev
      KITH_SCREEN_NAME: KithDevScreen
      KITH_SCREEN_BUNDLE_ID: com.yingkailiao.kith.dev.screen
      KITH_DATA_FOLDER: .kith/serve
      KITH_APNS_ENVIRONMENT: production
schemes:
  iOS:
    build:
      targets:
        iOS: all
    run:
      config: Debug
    archive:
      config: Release
  iOS Dev:
    build:
      targets:
        iOS: all
    run:
      config: DevDebug
    archive:
      config: DevRelease
  Screen:
    build:
      targets:
        Screen: all
    run:
      config: Debug
    archive:
      config: Release
  Screen Dev:
    build:
      targets:
        Screen: all
    run:
      config: DevDebug
    archive:
      config: DevRelease
targets:
  # Screen capture, input and WebRTC for Remote screen. A separate signed bundle so
  # macOS's Screen Recording / Accessibility grants belong to it (see host/src/screen/).
  Screen:
    type: application
    platform: macOS
    sources:
      - screen-macos
      - path: desktop/resources/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: WebRTC
    settings:
      base:
        INFOPLIST_FILE: screen-macos/Info.plist
        PRODUCT_NAME: $(KITH_SCREEN_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(KITH_SCREEN_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(KITH_APP_NAME) Screen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
    postBuildScripts:
      # The computer-use driver bots act through (host/src/screen/cua.rs), pinned and checked
      # by packaging/cua-driver. Its own Developer ID signature stays: it is never re-signed.
      - name: Embed cua-driver
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          node "$SRCROOT/packaging/cua-driver/fetch.mjs" darwin "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
  iOS:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes:
          - Widgets
          - NotificationService
          - ShareExtension
          - WhatsNew.md
          # The app's shared Swift package (models, client, screens), added as a package below.
          - Kit
      # The widget's bot buttons run this intent in the app.
      - ios/Widgets/OpenBotIntent.swift
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: KithKit
        product: KithKit
      - package: KithKit
        product: KithUI
      - target: Widgets
        embed: true
      - target: NotificationService
        embed: true
      - target: ShareExtension
        embed: true
    postBuildScripts:
      - name: Kith environment
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          # The scheme chooses an environment independently of Debug/Release optimization.
          cp "$SRCROOT/shared/Config/$KITH_ENV.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AccountConfig.plist"
          # The Open-source licenses screen reads the generated third-party notices.
          cp "$SRCROOT/../THIRD_PARTY_NOTICES.md" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/THIRD_PARTY_NOTICES.md"
          # The build environment's KITH_CLERK_PUBLISHABLE_KEY / KITH_CLOUD_URL win over the plist.
          ACCOUNT_PLIST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AccountConfig.plist"
          ACCOUNT_KEY="${KITH_CLERK_PUBLISHABLE_KEY}"
          ACCOUNT_CLOUD="${KITH_CLOUD_URL}"
          if [ -n "$ACCOUNT_KEY" ]; then /usr/libexec/PlistBuddy -c "Set :clerkPublishableKey $ACCOUNT_KEY" "$ACCOUNT_PLIST"; fi
          if [ -n "$ACCOUNT_CLOUD" ]; then /usr/libexec/PlistBuddy -c "Set :cloudURL $ACCOUNT_CLOUD" "$ACCOUNT_PLIST"; fi
          # Optional, gitignored: the PostHog project key. Absent = analytics sends nothing.
          if [ -f "$SRCROOT/shared/Config/Secrets.plist" ]; then
            cp "$SRCROOT/shared/Config/Secrets.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Secrets.plist"
          else
            rm -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Secrets.plist"
          fi
    settings:
      base:
        PRODUCT_NAME: $(KITH_APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(KITH_IOS_BUNDLE_ID)
        INFOPLIST_FILE: ios/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ios/Resources/iOS$(KITH_ENTITLEMENTS_SUFFIX_$(KITH_PERSONAL_TEAM)).entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: $(KITH_APP_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code shown on your computer, or take a photo to send to a bot.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to your bots in a voice call.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Confirm it's you before letting a new device use your computer.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Your words are transcribed on this iPhone and sent to your bot as a message.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Kith connects to the computer running your bots on your local network.
        # Portrait everywhere except the screen viewer (AppDelegate + OrientationLock).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Black / white instead of the system blue in menus, alerts and system sheets.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - ios/Widgets
    dependencies:
      - package: KithKit
        product: KithKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: KithWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(KITH_IOS_BUNDLE_ID).LiveActivity
        INFOPLIST_FILE: ios/Widgets/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ios/Widgets/Resources/Widgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: $(KITH_APP_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # Opens end-to-end sealed alert text (spec §6.7) with this account's push key from the shared Keychain.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - ios/NotificationService
    dependencies:
      - package: KithKit
        product: KithKit
    settings:
      base:
        PRODUCT_NAME: KithNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: $(KITH_IOS_BUNDLE_ID).NotificationService
        INFOPLIST_FILE: ios/NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ios/NotificationService/NotificationService.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: $(KITH_APP_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # "Kith" in other apps' share sheets: queues a link for a chat in the App Group; the app sends it (KithApp.deliverShares).
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ios/ShareExtension
    dependencies:
      - package: KithKit
        product: KithKit
    settings:
      base:
        PRODUCT_NAME: KithShare
        PRODUCT_BUNDLE_IDENTIFIER: $(KITH_IOS_BUNDLE_ID).Share
        INFOPLIST_FILE: ios/ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ios/ShareExtension/ShareExtension.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: $(KITH_APP_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
