[package]
name = "kith-attach"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The attach client (M1-6): raw-mode terminal side of `kith attach`, speaking the relay's attach frames"
license = "Apache-2.0"
publish = false
# An out-of-tree member of the host workspace (shares its Cargo.lock and target/), like core/holder and core/stub.
workspace = "../../serve/host"

# A small library on its own so the Windows CI job can build and test the console code: serve/host cannot build there
# (kith-core's bundled SQLite). Depends only on the holder's wire and platform layer.
[lib]
name = "kith_attach"
path = "src/lib.rs"

[dependencies]
kith-holder = { path = "../holder" }
# The control frames are JSON, as the holder's own.
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
