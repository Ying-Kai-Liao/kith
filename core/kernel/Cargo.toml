[package]
name = "kith-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The kernel's rules in Rust, shared by the kith program and the host: where Kith's folders are"
license = "Apache-2.0"
publish = false
# An out-of-tree member of the host workspace (shares its Cargo.lock and target/): cargo only searches parent folders for a root.
workspace = "../../serve/host"

[lib]
name = "kith_kernel"
path = "src/lib.rs"

# Std only for now: the CLI and the host both link this, so it stays light as more kernel modules move in.
[dependencies]

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
