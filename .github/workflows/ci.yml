name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Label events don't start this workflow (ci-label.yml dispatches it for ci:full), so a label never
# creates a run, and never a skipped `ci` check.
# A PR gets one group per ref, so a re-push cancels the older run. Every other run (push to main,
# workflow_dispatch, including the reviewer's batch run) gets its own group keyed by sha, so merges never cancel each other. GitHub keeps
# only one pending run per group, so sharing a group for main would drop the older queued run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}-{2}', github.workflow, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  CARGO_TERM_COLOR: always

jobs:
  # Path filtering happens here, not in `on.paths`, so the `ci` job below always
  # reports and can be the one required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The heavy tier (macOS builds, all e2e, guest-linux) runs on everything but a pull request. A pull request
      # runs it when it is ready (non-draft) and carries the ci:full label. Ordinary drafts stay cheap-only.
      # The flow reviewer's batch is checked by a workflow_dispatch run on its flow/batch-<sha> branch, which is heavy.
      # pull_request is empty on other events, so it is only read for pull requests.
      heavy: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
      kernel: ${{ steps.f.outputs.kernel }}
      host: ${{ steps.h.outputs.host }}
      host_core: ${{ steps.h.outputs.host_core }}
      cloud: ${{ steps.h.outputs.cloud }}
      licenses: ${{ steps.f.outputs.licenses }}
      threads: ${{ steps.f.outputs.threads }}
      revoke: ${{ steps.f.outputs.revoke }}
      ios: ${{ steps.h.outputs.ios }}
      desktop: ${{ steps.h.outputs.desktop }}
      relay: ${{ steps.h.outputs.relay }}
      e2e: ${{ steps.h.outputs.e2e }}
      guest_linux: ${{ steps.h.outputs.guest_linux }}
      bot_e2e: ${{ steps.h.outputs.bot_e2e }}
    steps:
      - uses: actions/checkout@v4
      # On push to main dorny compares with the previous commit, so main only runs what changed.
      # Kernel and licenses keep markdown: the notices file and kernel docs are checked content.
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            kernel:
              - 'kernel/**'
              - '.github/workflows/ci.yml'
            licenses:
              - '**/Cargo.lock'
              - '**/package-lock.json'
              - '**/package.json'
              - '**/Cargo.toml'
              - '**/Package.resolved'
              - 'NOTICE'
              - 'THIRD_PARTY_NOTICES.md'
              - 'scripts/notices/**'
              - 'apps/packaging/cua-driver/LICENSE'
              - 'serve/host/crates/memory/LICENSE'
              - 'apps/ios/Kit/Sources/KithKit/Resources/ThirdPartyNotices/**'
              - '.github/workflows/ci.yml'
            # The TLA+ model of one writer per thread and the code it covers (the list in the thread-writers skill).
            threads:
              - 'verification/threads/**'
              - '.claude/skills/thread-writers/**'
              - 'kernel/bin/kith-sessions'
              - 'kernel/bin/kith'
              - 'serve/host/src/terminal/**'
              - 'serve/host/src/api/threads.rs'
              - 'serve/host/src/api/bots.rs'
              - 'serve/host/src/api/botguests.rs'
              - 'serve/host/src/agent/bot/**'
              - 'serve/host/src/hub/actors.rs'
              - '.github/workflows/ci.yml'
            # The TLA+ model of revoking a person and the code it covers (the list in the revoke-access skill).
            revoke:
              - 'verification/revoke/**'
              - 'verification/threads/run.sh'
              - '.claude/skills/revoke-access/**'
              - 'kernel/bin/kith-auth'
              - 'kernel/lib/kith_bridge/core.py'
              - 'serve/host/src/api/people.rs'
              - 'serve/host/src/api/botguests.rs'
              - 'serve/host/src/remote/**'
              - 'serve/cloud/src/routes/invites.ts'
              - 'serve/cloud/src/routes/host.ts'
              - '.github/workflows/ci.yml'
      # 'every': a file must match the whole list, so each filter is one brace pattern plus a markdown
      # exclusion. A docs-only change then runs no heavy job. The only markdown that ships is
      # apps/ios/WhatsNew.md (an iOS resource), so ios excludes just READMEs.
      - uses: dorny/paths-filter@v3
        id: h
        with:
          predicate-quantifier: every
          filters: |
            host:
              - '{serve/host/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            # What the root crate builds from: the host and the memory and wire crates, not guest or tts, which
            # nothing in the host depends on. Those two get their own small job (host-crates).
            host_core:
              - '{serve/host/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,.github/workflows/ci.yml}'
              - '!serve/host/crates/guest/**'
              - '!serve/host/crates/tts/**'
              - '!**/*.md'
            cloud:
              - '{serve/cloud/**,serve/docs/reference/fixtures/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            relay:
              - '{serve/relay/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            ios:
              - '{apps/ios/**,apps/shared/**,apps/Kith.xcodeproj/**,apps/project.yml,.github/workflows/ci.yml}'
              - '!**/README.md'
            desktop:
              - '{apps/desktop/**,apps/packaging/**,apps/shared/**,apps/screen-macos/**,apps/Kith.xcodeproj/**,apps/project.yml,serve/host/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            # The static Linux client (kith-guest) and the scripts and workflow that package and install it.
            guest_linux:
              - '{serve/host/crates/guest/**,serve/host/crates/wire/**,serve/host/Cargo.lock,serve/rust-toolchain.toml,scripts/package-guest.sh,scripts/install-guest.sh,scripts/smoke-guest.sh,.github/workflows/release.yml,.github/workflows/ci.yml}'
              - '!**/*.md'
            # The real kith-guest against a real kith-serve and wrangler dev (apps/desktop/tools/relay-e2e-bot.ts).
            bot_e2e:
              - '{serve/host/**,serve/cloud/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,kernel/bin/kith-auth,apps/desktop/tools/relay-e2e-host.ts,apps/desktop/tools/relay-e2e-bot.ts,.github/workflows/ci.yml}'
              - '!**/*.md'
            # The e2e also runs serve/cloud's wrangler dev, so cloud changes trigger it (not the macOS desktop job).
            e2e:
              - '{apps/desktop/**,apps/packaging/**,apps/shared/**,apps/screen-macos/**,apps/Kith.xcodeproj/**,apps/project.yml,serve/host/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,serve/cloud/**,.github/workflows/ci.yml}'
              - '!**/*.md'
  kernel:
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: bash -n kernel/bin/kith
        run: bash -n kernel/bin/kith
      - uses: astral-sh/setup-uv@v5
      - name: Bridge check
        run: kernel/tests/kith-bridge-check
      - name: Launchd check
        run: kernel/tests/kith-launchd-check
      - name: Project check
        run: kernel/tests/kith-project-check
      - name: Serve check
        run: kernel/tests/kith-serve-check
      - name: Info check
        run: kernel/tests/kith-info-check
      - name: Migrate check
        run: kernel/tests/kith-migrate-check
      - name: Unknown agent check
        run: kernel/tests/kith-unknown-agent-check
      - name: Pkg EINTR check
        run: kernel/tests/kith-pkg-eintr-check
      - name: Auth check
        run: kernel/tests/kith-auth-check
      - name: Auth lock check
        run: kernel/tests/kith-auth-lock-check
      - name: Auth property check
        run: kernel/tests/kith-auth-props
      - name: Auth revoke check
        run: kernel/tests/kith-auth-revoke-check
      - name: Bridge revoke check
        run: kernel/tests/kith-bridge-revoke-check
      - name: Cost bots check
        run: kernel/tests/kith-cost-bots-check
      - name: Call check
        run: kernel/tests/kith-call-check
      - name: Ask check
        run: kernel/tests/kith-ask-check
      - name: Wake check
        run: kernel/tests/kith-wake-check
      - name: Schedule person check
        run: kernel/tests/kith-sched-person-check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Plugin hooks test
        run: bun test kernel/tests/kith-hooks.test.ts
      - name: Trajectory check
        run: kernel/tests/kith-trajectory-check
      - name: Recall check
        run: kernel/tests/kith-recall-check
      - name: Bug check
        run: kernel/tests/kith-bug-check
      - name: Guest sandbox check
        run: kernel/tests/kith-guest-sandbox-check
      - name: Load check
        run: kernel/tests/kith-load-check

  # Exits 0 when every row of verification/threads/checks.tsv matches its expected pass/fail, so green means no
  # change from the recorded baseline (some rows are known findings on purpose).
  thread-writers:
    needs: changes
    if: needs.changes.outputs.threads == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kith-verify
          key: kith-verify-${{ hashFiles('verification/threads/run.sh') }}
      - name: TLA+ model check
        run: verification/threads/run.sh

  # The same for revoking a person: verification/revoke/checks.tsv, every row as expected.
  revoke-access:
    needs: changes
    if: needs.changes.outputs.revoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kith-verify
          key: kith-verify-${{ hashFiles('verification/threads/run.sh') }}
      - name: TLA+ model check
        run: verification/revoke/run.sh

  # Format and clippy on the whole host workspace. The tests are in host-build, host-test and host-crates.
  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: serve
    steps:
      - uses: actions/checkout@v4
      # rustup reads serve/rust-toolchain.toml (pinned + clippy + rustfmt). Format first: it fails in seconds,
      # before the apt and cache steps.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --manifest-path host/Cargo.toml --all --check
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      # Only main saves the cache: PR and batch refs can't share caches, so their saves just evict main's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --manifest-path host/Cargo.toml --workspace --all-targets -- -D warnings

  # Builds every test binary once and ships them as a nextest archive, so the shards below only run tests.
  host-build:
    needs: changes
    if: needs.changes.outputs.host_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-linux-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Build the test archive
        working-directory: serve/host
        run: cargo nextest archive --workspace --exclude kith-guest --exclude kith-tts --archive-file "$RUNNER_TEMP/host-tests.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: host-tests
          path: ${{ runner.temp }}/host-tests.tar.zst
          retention-days: 1
          compression-level: 0

  # Unit tests of the host (cheap tier). The test binaries bake in absolute paths (CARGO_MANIFEST_DIR, CARGO_BIN_EXE_kith-serve), so the
  # archive is unpacked into serve/host/target, where it was built.
  # The slow integration tests (tests/*.rs, each spawns a real kith-serve and python fixtures) are host-e2e.
  host-test:
    needs: [changes, host-build]
    if: needs.changes.outputs.host_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - uses: actions/download-artifact@v4
        with:
          name: host-tests
          path: ${{ runner.temp }}
      - name: Run
        working-directory: serve/host
        run: >-
          cargo nextest run --profile ci
          --archive-file "$RUNNER_TEMP/host-tests.tar.zst"
          --extract-to . --extract-overwrite
          --workspace-remap .
          -E 'not kind(test)'

  # The slow integration tests (tests/*.rs, each spawns a real kith-serve and python fixtures) in three shards
  # (heavy tier). The test binaries bake in absolute paths (CARGO_MANIFEST_DIR, CARGO_BIN_EXE_kith-serve), so the
  # archive is unpacked into serve/host/target, where it was built.
  host-e2e:
    name: host-e2e (${{ matrix.shard }}/3)
    needs: [changes, host-build]
    if: needs.changes.outputs.host_core == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - uses: actions/download-artifact@v4
        with:
          name: host-tests
          path: ${{ runner.temp }}
      - name: Run
        working-directory: serve/host
        run: >-
          cargo nextest run --profile ci
          --archive-file "$RUNNER_TEMP/host-tests.tar.zst"
          --extract-to . --extract-overwrite
          --workspace-remap .
          -E 'kind(test)' --partition count:${{ matrix.shard }}/3

  # guest and tts do not feed the host, so a change to only them skips the build above. Also the doctests, which
  # nextest does not run.
  host-crates:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: serve/host
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-crates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Tests
        run: cargo nextest run --profile ci -p kith-guest -p kith-tts -p kith-wire -p kith-mem
      - name: Doctests
        run: cargo test --doc -p kith-guest -p kith-tts -p kith-wire -p kith-mem

  cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: serve/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serve/cloud/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
      # wrangler dev with a local D1 and a fake host; no secrets.
      - name: Bot guests e2e
        if: needs.changes.outputs.heavy == 'true'
        run: npm run e2e:bot

  # THIRD_PARTY_NOTICES.md is generated; fail when it is stale or a shipped license is unsafe to sell with Kith
  # (scripts/notices/policy.json, docs/open-source.md).
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            serve/cloud/package-lock.json
            serve/relay/package-lock.json
      # The npm licenses are read from node_modules; scripts stay off, nothing is built.
      - name: Install npm dependencies
        run: |
          for d in apps/desktop serve/cloud serve/relay; do
            npm ci --prefix "$d" --ignore-scripts --no-audit --no-fund
          done
      - name: Notices generator tests
        run: node --test scripts/notices/generate.test.mjs
      - name: Notices are current and licenses pass the policy
        run: node scripts/notices/generate.mjs --check

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: serve/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serve/relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/dd/SourcePackages
          key: ${{ runner.os }}-ios-packages-${{ hashFiles('apps/ios/Kit/Package.swift', 'apps/Kith.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # The project is committed (xcodegen output), so there is nothing to generate.
      - name: Build iOS Dev for the simulator
        run: >-
          xcodebuild build
          -project apps/Kith.xcodeproj
          -scheme "iOS Dev"
          -configuration DevDebug
          -derivedDataPath build/dd
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      # rustup reads serve/rust-toolchain.toml from here; tools/native-host.mjs builds with it.
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: desktop-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native pieces
        run: |
          mkdir -p build/native
          # SF Symbols masks and the DMG background are generated at build time, never committed.
          npm run icons
          swift ../packaging/dmg/background.swift build/dmg-background.tiff
      - name: Build the Mac dev app (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:dev -- --publish never
      - name: Show the result
        run: ls -la dist

  # Typecheck and unit tests of the desktop's TypeScript: nothing in them is macOS-only.
  desktop-js:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # The desktop's relay client against a real kith-serve and wrangler dev (owner, then an invitee). Linux: cheaper than
  # the Mac runner, and nothing in it is macOS-only.
  desktop-relay-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            serve/cloud/package-lock.json
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: desktop-relay-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --manifest-path serve/host/Cargo.toml --bin kith-serve
      - run: npm --prefix serve/cloud ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --ignore-scripts --no-audit --no-fund
      - name: Relay e2e (real host)
        working-directory: apps/desktop
        env:
          KITH_SERVE_HOST_BIN: ${{ github.workspace }}/serve/host/target/debug/kith-serve
        run: npm run e2e:relay:host

  # Bot guests, end to end: the real kith-guest binary joins and asks through wrangler dev and a real kith-serve with a
  # stub agent (the desktop relay e2e's harness, plus the bot stage that runs when KITH_GUEST_BIN is set).
  bot-guests-e2e:
    needs: changes
    if: needs.changes.outputs.bot_e2e == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: bot-guests-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --manifest-path serve/host/Cargo.toml --bin kith-serve
      - run: cargo build --manifest-path serve/host/Cargo.toml -p kith-guest
      - run: npm --prefix serve/cloud ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --ignore-scripts --no-audit --no-fund
      - name: Bot guests e2e (real host, real kith-guest)
        working-directory: apps/desktop
        env:
          KITH_SERVE_HOST_BIN: ${{ github.workspace }}/serve/host/target/debug/kith-serve
          KITH_GUEST_BIN: ${{ github.workspace }}/serve/host/target/debug/kith-guest
        run: npm run e2e:relay:host

  # The Linux client for cloud-bot VMs: static musl build per CPU on a native runner (no qemu), then the one-command
  # installer against the tarball it just built. Mirrors release.yml's build-guest without publishing anything.
  guest-linux:
    needs: changes
    if: needs.changes.outputs.guest_linux == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { arch: aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Rust + zig
        run: |
          cd serve
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang cargo-zigbuild
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      # Only main saves the cache: PR refs can't share caches, so their saves just evict main's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: guest-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cd serve/host && cargo zigbuild --release --locked -p kith-guest --target ${{ matrix.target }}
      - name: Static check
        run: |
          f=serve/host/target/${{ matrix.target }}/release/kith-guest
          file "$f"
          file "$f" | grep -qE 'statically linked|static-pie'
      - name: No aws-lc, openssl or native-tls in the client
        run: |
          cd serve/host
          if cargo tree -p kith-guest -e normal | grep -E 'aws-lc|openssl|native-tls'; then exit 1; fi
      - name: Pack
        run: scripts/package-guest.sh 0.0.0-ci ${{ matrix.arch }} serve/host/target/${{ matrix.target }}/release/kith-guest dist
      - name: Install from the tarball and smoke test
        run: |
          KITH_GUEST_PREFIX="$RUNNER_TEMP/prefix" KITH_INSTALL_TARBALL="$(echo dist/*.tar.gz)" sh scripts/install-guest.sh
          # Running it again upgrades in place.
          KITH_GUEST_PREFIX="$RUNNER_TEMP/prefix" KITH_INSTALL_TARBALL="$(echo dist/*.tar.gz)" sh scripts/install-guest.sh
          scripts/smoke-guest.sh "$RUNNER_TEMP/prefix/bin/kith"

  # The single check to require: passes when every needed job passed or was
  # skipped by the filter, fails on any failure or cancellation.
  # Skipped when the run itself is cancelled (a re-push superseded it), so it reports no failing `ci`. A job cancelled or timed out inside a live run still fails it through RESULTS.
  ci:
    if: ${{ !cancelled() }}
    needs: [changes, kernel, host, host-build, host-test, host-e2e, host-crates, cloud, licenses, thread-writers, revoke-access, relay, ios, desktop, desktop-js, desktop-relay-e2e, bot-guests-e2e, guest-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
