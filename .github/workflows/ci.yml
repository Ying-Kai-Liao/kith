name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # mode=check is the cheap by-hand Rust check for workers (the rust-check job at the bottom). Push, PR and
      # a dispatch with no inputs are all mode=full: exactly the jobs below, as before.
      mode:
        description: "full = the whole pipeline (batch runs); check = only the rust-check job"
        type: choice
        options: [full, check]
        default: full
      packages:
        description: "check mode: cargo package names (-p), space separated"
        type: string
        default: ""
      os:
        description: "check mode: which runners"
        type: choice
        options: [all, linux, windows, macos]
        default: all
      artifact:
        description: "check mode: also build the kith binary and upload it as an artifact"
        type: boolean
        default: false

# Label events don't start this workflow (ci-label.yml dispatches it for ci:full), so a label never
# creates a run, and never a skipped `ci` check.
# A PR gets one group per ref, so a re-push cancels the older run. Every other run (push to main,
# workflow_dispatch, including the reviewer's batch run) gets its own group keyed by sha, so merges never cancel each other. GitHub keeps
# only one pending run per group, so sharing a group for main would drop the older queued run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}-{2}', github.workflow, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  CARGO_TERM_COLOR: always

jobs:
  # Path filtering happens here, not in `on.paths`, so the `ci` job below always
  # reports and can be the one required check.
  changes:
    # Check mode skips this job, and with it (needs) every job below that depends on it.
    if: ${{ inputs.mode != 'check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The heavy tier (macOS builds, all e2e, guest-linux) runs on everything but a pull request. A pull request
      # runs it when it is ready (non-draft) and carries the ci:full label. Ordinary drafts stay cheap-only.
      # The flow reviewer's batch is checked by a workflow_dispatch run on its flow/batch-<sha> branch, which is heavy.
      # pull_request is empty on other events, so it is only read for pull requests.
      heavy: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
      kernel: ${{ steps.f.outputs.kernel }}
      kernel_host: ${{ steps.f.outputs.kernel_host }}
      host: ${{ steps.h.outputs.host }}
      host_core: ${{ steps.h.outputs.host_core }}
      cloud: ${{ steps.h.outputs.cloud }}
      licenses: ${{ steps.f.outputs.licenses }}
      threads: ${{ steps.f.outputs.threads }}
      revoke: ${{ steps.f.outputs.revoke }}
      secrets: ${{ steps.f.outputs.secrets }}
      ios: ${{ steps.h.outputs.ios }}
      desktop: ${{ steps.h.outputs.desktop }}
      relay: ${{ steps.h.outputs.relay }}
      e2e: ${{ steps.h.outputs.e2e }}
      guest_linux: ${{ steps.h.outputs.guest_linux }}
      bot_e2e: ${{ steps.h.outputs.bot_e2e }}
      windows: ${{ steps.h.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      # On push to main dorny compares with the previous commit, so main only runs what changed.
      # Kernel and licenses keep markdown: the notices file and kernel docs are checked content.
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            kernel:
              - 'kernel/**'
              - 'serve/contract/kernel/**'
              # The core boundary check reads kith-core's sources and every Cargo.toml.
              - 'core/runtime/**'
              - 'core/api/**'
              - '**/Cargo.toml'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
            # The kernel files the host's own unit tests run for real (the list: scripts/ci/host-kernel-tests.txt). A
            # change here runs only those tests (host-kernel), not the whole host suite.
            kernel_host:
              - 'kernel/bin/**'
              - 'kernel/lib/**'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
            licenses:
              - '**/Cargo.lock'
              - '**/package-lock.json'
              - '**/package.json'
              - '**/Cargo.toml'
              - '**/Package.resolved'
              - 'NOTICE'
              - 'THIRD_PARTY_NOTICES.md'
              - 'scripts/notices/**'
              - 'apps/packaging/cua-driver/LICENSE'
              - 'apps/ios/Kit/Sources/KithKit/Resources/ThirdPartyNotices/**'
              - 'apps/ios/Kit/Sources/KithUI/Resources/Mermaid/**'
              - '.github/workflows/ci.yml'
            # The TLA+ model of one writer per thread and the code it covers (the list in the thread-writers skill).
            threads:
              - 'verification/threads/**'
              - '.claude/skills/thread-writers/**'
              - 'kernel/bin/kith-sessions'
              - 'kernel/bin/kith-lifecycle'
              - 'kernel/bin/kith-wake'
              - 'kernel/bin/kith'
              - 'serve/host/src/terminal/**'
              - 'serve/host/src/cards/resume.rs'
              - 'serve/host/src/api/threads.rs'
              - 'serve/host/src/api/bots.rs'
              - 'serve/host/src/api/botguests.rs'
              - 'serve/host/src/agent/bot/**'
              - 'serve/host/src/hub/actors.rs'
              - 'core/kernel/src/threads.rs'
              - 'core/kernel/src/threads/**'
              - 'kernel/tests/kith-threads-race'
              - '.github/workflows/ci.yml'
            # The TLA+ model of revoking a person and the code it covers (the list in the revoke-access skill).
            revoke:
              - 'verification/revoke/**'
              - 'verification/threads/run.sh'
              - '.claude/skills/revoke-access/**'
              - 'kernel/bin/kith-auth'
              - 'serve/host/src/channels/**'
              - 'serve/host/src/api/people.rs'
              - 'serve/host/src/api/botguests.rs'
              - 'serve/host/src/remote/**'
              - 'serve/cloud/src/routes/invites.ts'
              - 'serve/cloud/src/routes/host.ts'
              - '.github/workflows/ci.yml'
            # The TLA+ model of one secret card's steps and the code it covers (the list in the secret-cards skill).
            secrets:
              - 'verification/secrets/**'
              - 'verification/threads/run.sh'
              - '.claude/skills/secret-cards/**'
              - 'serve/host/src/cards/secret.rs'
              - 'serve/host/src/cards/mod.rs'
              - 'serve/host/src/store/cards.rs'
              - 'serve/host/src/api/cards.rs'
              - 'serve/host/src/api/bots.rs'
              - 'serve/host/src/api/roles.rs'
              - 'kernel/bin/kith-auth'
              - '.github/workflows/ci.yml'
      # 'every': a file must match the whole list, so each filter is one brace pattern plus a markdown
      # exclusion. A docs-only change then runs no heavy job. The only markdown that ships is
      # apps/ios/WhatsNew.md (an iOS resource), so ios excludes just READMEs.
      - uses: dorny/paths-filter@v3
        id: h
        with:
          predicate-quantifier: every
          filters: |
            host:
              - '{serve/host/**,core/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,serve/contract/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            # What the root crate builds from: the host and the memory and wire crates, not guest or tts, which
            # nothing in the host depends on. Those two get their own small job (host-crates). The kernel's bin and lib
            # are not here: the host tests that run them are the host-kernel job (filter kernel_host above).
            host_core:
              - '{serve/host/**,core/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,serve/contract/**,.github/workflows/ci.yml}'
              - '!serve/host/crates/guest/**'
              - '!serve/host/crates/tts/**'
              - '!**/*.md'
            # The Windows job builds and tests the holder (and kith-core when the branch has it) and what they stand on.
            windows:
              - '{core/holder/**,core/runtime/**,core/api/**,serve/host/Cargo.toml,serve/host/Cargo.lock,serve/rust-toolchain.toml,.github/workflows/ci.yml}'
              - '!**/*.md'
            cloud:
              - '{serve/cloud/**,serve/contract/**,serve/docs/reference/fixtures/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            relay:
              - '{serve/relay/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            ios:
              - '{apps/ios/**,apps/shared/**,apps/Kith.xcodeproj/**,apps/project.yml,serve/contract/**,.github/workflows/ci.yml}'
              - '!**/README.md'
            desktop:
              - '{apps/desktop/**,apps/packaging/**,apps/shared/**,apps/screen-macos/**,apps/Kith.xcodeproj/**,apps/project.yml,serve/host/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,serve/contract/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            # The static Linux client (kith-guest) and the scripts and workflow that package and install it.
            guest_linux:
              - '{serve/host/crates/guest/**,serve/host/crates/wire/**,serve/contract/**,serve/host/Cargo.lock,serve/rust-toolchain.toml,scripts/package-guest.sh,scripts/install-guest.sh,scripts/smoke-guest.sh,.github/workflows/release.yml,.github/workflows/ci.yml}'
              - '!**/*.md'
            # The real kith-guest against a real kith-serve and wrangler dev (apps/desktop/tools/relay-e2e-bot.ts).
            bot_e2e:
              - '{serve/host/**,serve/cloud/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,serve/contract/**,kernel/bin/kith-auth,apps/desktop/tools/relay-e2e-host.ts,apps/desktop/tools/relay-e2e-bot.ts,.github/workflows/ci.yml}'
              - '!**/*.md'
            # The e2e also runs serve/cloud's wrangler dev, so cloud changes trigger it (not the macOS desktop job).
            e2e:
              - '{apps/desktop/**,apps/packaging/**,apps/shared/**,apps/screen-macos/**,apps/Kith.xcodeproj/**,apps/project.yml,serve/host/**,serve/rust-toolchain.toml,serve/docs/reference/fixtures/**,serve/contract/**,serve/cloud/**,.github/workflows/ci.yml}'
              - '!**/*.md'
  # The kernel's own checks in three parallel shards, balanced by measured time (about 2.5 minutes each). Every check
  # runs exactly once; a shard runs all its checks even after one fails, then fails naming each failed check.
  kernel:
    name: kernel (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            checks: |
              bash -n kernel/bin/kith|bash -n kernel/bin/kith
              Migrate check|kernel/tests/kith-migrate-check
              Guest sandbox check|kernel/tests/kith-guest-sandbox-check
              Launchd check|kernel/tests/kith-launchd-check
              Project check|kernel/tests/kith-project-check
              Contract check (what the host reads, serve/contract/kernel)|kernel/tests/kith-contract-check
              Serve check|kernel/tests/kith-serve-check
              Info check|kernel/tests/kith-info-check
              Harness check (kith <agent> set harness, no Claude model on another harness)|kernel/tests/kith-harness-check
              Unknown agent check|kernel/tests/kith-unknown-agent-check
              Self-update check|kernel/tests/kith-self-update-check
              Pkg EINTR check|kernel/tests/kith-pkg-eintr-check
              Differential harness (same CLI line, same result) self-test and seed corpus|kernel/tests/kith-difftest-check --summary difftest-summary.json
              Agent set check (kith <agent> set model/effort, --json, a model per backup entry)|kernel/tests/kith-agent-set-check
              Footguns check|kernel/tests/kith-footguns-check
          - shard: 2
            checks: |
              Auth property check|kernel/tests/kith-auth-props
              Ask check|kernel/tests/kith-ask-check
              Auth check|kernel/tests/kith-auth-check
              Auth lock check|kernel/tests/kith-auth-lock-check
              Auth revoke check|kernel/tests/kith-auth-revoke-check
              Helper MCP grants check|kernel/tests/kith-helper-mcp-check
              Cost bots check|kernel/tests/kith-cost-bots-check
              Call check|kernel/tests/kith-call-check
              Chain check|kernel/tests/kith-chain-check
              People check (kith people, kith invite, kith bot ls/invite/revoke/decide/auto-allow --json, against a stub host)|kernel/tests/kith-people-check
              Account check (kith account add/remove/list --json, the login command returned and not run)|kernel/tests/kith-account-check
              Grants check (connectors and skills as grants on an agent)|kernel/tests/kith-grants-check
          - shard: 3
            bun: true
            checks: |
              Lifecycle check|kernel/tests/kith-lifecycle-check
              Schedule person check|kernel/tests/kith-sched-person-check
              Terminal flags check|kernel/tests/kith-terminal-flags-check
              Recall check|kernel/tests/kith-recall-check
              Load check|kernel/tests/kith-load-check
              Guest helper check|kernel/tests/kith-guest-helper-check
              Wake check|kernel/tests/kith-wake-check
              Guest jobs check|kernel/tests/kith-guest-jobs-check
              Schedule jobs file check|kernel/tests/kith-sched-jobs-check
              Send check|kernel/tests/kith-send-check
              Schedule origin check|kernel/tests/kith-sched-origin-check
              Plugin hooks test|bun test kernel/tests/kith-hooks.test.ts
              Trajectory check|kernel/tests/kith-trajectory-check
              Bug check|kernel/tests/kith-bug-check
              Guest door check|kernel/tests/kith-guest-door-check
              Schedule json check (kith schedule ls/add/rm/pause/resume/run/log --json, the error object)|kernel/tests/kith-sched-json-check
              Auth json check (kith auth ls/granted/grant/revoke --json, no secret value in any output)|kernel/tests/kith-auth-json-check
              New check (kith new --json - the agent made, or the error object and no folder left)|kernel/tests/kith-new-check
              Pkg json check (kith versions, history, pin, unpin, restore, install, share, deps, update, push, commit --json)|kernel/tests/kith-pkg-json-check
              JSON misc check (--json on doctor, remote, ask ls, bug, backup add/remove, update self --check, wake status, lifecycle, chain, project)|kernel/tests/kith-json-misc-check
              Scratch check (the built-in scratch agent: engine per chat, never backed up or shared, keep as an agent)|kernel/tests/kith-scratch-check
              Core boundary check (kith-core stays sealed)|kernel/tests/kith-core-boundary-check
              Core boundary self-test (each rule fails on a deliberate violation)|kernel/tests/kith-core-boundary-check --selftest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun
        with:
          bun-version: 1.3.8
      - name: Checks
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          failed=0
          while IFS='|' read -r name cmd; do
            [ -n "$name" ] || continue
            echo "::group::$name"
            # stdin from /dev/null: a check that reads stdin must not eat the rest of the list.
            if bash -c "$cmd" </dev/null; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error title=kernel check failed::$name ($cmd)"
              failed=$((failed + 1))
            fi
          done <<< "$CHECKS"
          [ "$failed" = 0 ] || { echo "$failed check(s) failed in this shard, see the ::error lines above"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard == 1
        with:
          name: difftest-summary
          path: difftest-summary.json
          if-no-files-found: ignore

  # Exits 0 when every row of verification/threads/checks.tsv matches its expected pass/fail, so green means no
  # change from the recorded baseline (some rows are known findings on purpose).
  thread-writers:
    needs: changes
    if: needs.changes.outputs.threads == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kith-verify
          key: kith-verify-${{ hashFiles('verification/threads/run.sh') }}
      - name: TLA+ model check
        run: verification/threads/run.sh

  # The same for revoking a person: verification/revoke/checks.tsv, every row as expected.
  revoke-access:
    needs: changes
    if: needs.changes.outputs.revoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kith-verify
          key: kith-verify-${{ hashFiles('verification/threads/run.sh') }}
      - name: TLA+ model check
        run: verification/revoke/run.sh

  # The same for a secret card (one writer per card, never after it closed): verification/secrets/checks.tsv.
  secret-cards:
    needs: changes
    if: needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kith-verify
          key: kith-verify-${{ hashFiles('verification/threads/run.sh') }}
      - name: TLA+ model check
        run: verification/secrets/run.sh

  # Format and clippy on the whole host workspace. The tests are in host-build, host-test and host-crates.
  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: serve
    steps:
      - uses: actions/checkout@v4
      # rustup reads serve/rust-toolchain.toml (pinned + clippy + rustfmt). Format first: it fails in seconds,
      # before the apt and cache steps.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --manifest-path host/Cargo.toml --all --check
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      # Only main saves the cache: PR and batch refs can't share caches, so their saves just evict main's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --manifest-path host/Cargo.toml --workspace --all-targets -- -D warnings
      # The holder owns processes and decides nothing: it must not link kith-core, kith-kernel or any other kith crate.
      - name: The holder links no kith crate
        run: sh ../scripts/check-holder-deps.sh
      # The method table: its OpenRPC file is current, nothing released is broken, and every contract and corpus verb
      # parses to its row (core/api/tests/table.rs). Regenerate with the command the failure message prints.
      - name: Method table (kith-api)
        run: cargo test --manifest-path host/Cargo.toml -p kith-api --locked

  # Windows from day one (docs/plans/runtime-design.md section 8): the holder's ConPTY, named pipes, job objects and
  # detaching only prove themselves here, including that the holder and its process survive the process that
  # started it. Runs on workflow_dispatch too (the changes job reports it for any run that is not a pull request).
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true' || needs.changes.outputs.host_core == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: serve
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --manifest-path host/Cargo.toml -p kith-holder --all-targets --locked -- -D warnings
      - name: Holder and platform layer tests
        run: cargo test --manifest-path host/Cargo.toml -p kith-holder --locked -- --test-threads=1
      # kith-kernel has Unix-only modules (threads) behind cfg; kith-core takes its lifetime lock with LockFileEx and
      # checks owner-only access lists with icacls. Both only prove themselves here.
      - name: Kernel and core runtime tests
        run: |
          cargo clippy --manifest-path host/Cargo.toml -p kith-core --all-targets --locked -- -D warnings
          cargo test --manifest-path host/Cargo.toml -p kith-core --locked
          cargo clippy --manifest-path host/Cargo.toml -p kith-api --all-targets --locked -- -D warnings
          cargo test --manifest-path host/Cargo.toml -p kith-api --locked
          cargo test --manifest-path host/Cargo.toml -p kith-kernel --locked --no-fail-fast

  # Builds every test binary once and ships them as a nextest archive, so the shards below only run tests.
  host-build:
    needs: changes
    if: needs.changes.outputs.host_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-linux-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Build the test archive
        working-directory: serve/host
        run: cargo nextest archive --workspace --exclude kith-guest --exclude kith-tts --archive-file "$RUNNER_TEMP/host-tests.tar.zst"
      # The Rust core against the Python kernel, the same CLI line both ways (kernel/tests/difftest): the test binaries above
      # already built the host's dependencies, so this adds the one kith program. Its router finds it through KITH_BIN.
      - name: Core parity (difftest --rust)
        run: |
          cargo build --manifest-path serve/host/Cargo.toml --bin kith
          kernel/tests/difftest/kith-difftest --rust --bin "$PWD/serve/host/target/debug/kith"
          # The same corpus again with the core database made first, so every Rust verb runs inside an embedded core.
          kernel/tests/difftest/kith-difftest --rust --core --bin "$PWD/serve/host/target/debug/kith"
          # And once more with a daemon running in each NEW sandbox, so the verbs the daemon answers go through its owner socket.
          kernel/tests/difftest/kith-difftest --rust --daemon --bin "$PWD/serve/host/target/debug/kith"
          KITH_DIFFTEST_BIN="$PWD/serve/host/target/debug/kith" kernel/tests/kith-launch-once-race-check
          KITH_DIFFTEST_BIN="$PWD/serve/host/target/debug/kith" kernel/tests/kith-auth-mixed-race-check
      - name: Run-once cost and kernel notes
        run: KITH_BIN="$PWD/serve/host/target/debug/kith" kernel/tests/kith-run-once-cost-check
      # kith-sessions and the Rust threads module claiming one thread at once: never more than one writer.
      - name: Thread writers, Python and Rust as two actors
        run: kernel/tests/kith-threads-race --bin "$PWD/serve/host/target/debug/kith" --iterations 60
      - name: Core dependency rules
        run: kernel/tests/kith-core-deps-check
      - uses: actions/upload-artifact@v4
        with:
          name: host-tests
          path: ${{ runner.temp }}/host-tests.tar.zst
          retention-days: 1
          compression-level: 0

  # Unit tests of the host (cheap tier). The test binaries bake in absolute paths (CARGO_MANIFEST_DIR, CARGO_BIN_EXE_kith-serve), so the
  # archive is unpacked into serve/host/target, where it was built.
  # The slow integration tests (tests/*.rs, each spawns a real kith-serve and python fixtures) are host-e2e.
  host-test:
    needs: [changes, host-build]
    if: needs.changes.outputs.host_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - uses: actions/download-artifact@v4
        with:
          name: host-tests
          path: ${{ runner.temp }}
      - name: Run
        working-directory: serve/host
        run: >-
          cargo nextest run --profile ci
          --archive-file "$RUNNER_TEMP/host-tests.tar.zst"
          --extract-to . --extract-overwrite
          --workspace-remap .
          -E 'not kind(test)'

  # A kernel-only change (kernel/bin, kernel/lib) runs just the host unit tests that run real kernel files, listed in
  # scripts/ci/host-kernel-tests.txt, instead of the whole host suite. Builds and runs in one job on the same cache as
  # host-build. When host_core is also set, host-test already runs them.
  # Three shards: the tests themselves are the cost (each starts the real kith-auth), the build is a warm-cache 2-3 minutes.
  host-kernel:
    name: host-kernel (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.kernel_host == 'true' && needs.changes.outputs.host_core != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-linux-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Run the listed tests
        working-directory: serve/host
        run: >-
          cargo nextest run --profile ci --workspace --exclude kith-guest --exclude kith-tts
          --partition count:${{ matrix.shard }}/3
          -E "($(sh ../../scripts/ci/host-kernel-tests.sh filter)) & not kind(test)"

  # Fails when a host unit test reads the kernel (a path into kernel/, or the api Rig that runs the real kith-auth) and
  # is not in scripts/ci/host-kernel-tests.txt: such a test would not run on a kernel-only change.
  host-kernel-check:
    needs: changes
    if: needs.changes.outputs.host == 'true' || needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci/host-kernel-tests.sh check

  # The slow integration tests (tests/*.rs, each spawns a real kith-serve and python fixtures) in three shards
  # (heavy tier). The test binaries bake in absolute paths (CARGO_MANIFEST_DIR, CARGO_BIN_EXE_kith-serve), so the
  # archive is unpacked into serve/host/target, where it was built.
  host-e2e:
    name: host-e2e (${{ matrix.shard }}/3)
    needs: [changes, host-build]
    if: needs.changes.outputs.host_core == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - uses: actions/download-artifact@v4
        with:
          name: host-tests
          path: ${{ runner.temp }}
      - name: Run
        working-directory: serve/host
        run: >-
          cargo nextest run --profile ci
          --archive-file "$RUNNER_TEMP/host-tests.tar.zst"
          --extract-to . --extract-overwrite
          --workspace-remap .
          -E 'kind(test)' --partition count:${{ matrix.shard }}/3

  # guest and tts do not feed the host, so a change to only them skips the build above. Also the doctests, which
  # nextest does not run.
  host-crates:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: serve/host
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-crates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Tests
        run: cargo nextest run --profile ci -p kith-guest -p kith-tts -p kith-wire -p kith-mem -p kith-kernel -p kith-core
      - name: Doctests
        run: cargo test --doc -p kith-guest -p kith-tts -p kith-wire -p kith-mem -p kith-kernel -p kith-core

  cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: serve/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serve/cloud/package-lock.json
      # serve/contract/{cloud,host}/contract.json are the one place the cloud API's and the host RPC's words are spelled;
      # the TS, Swift and Rust files made from them must be current (serve/contract/README.md).
      - name: Contract files are current
        run: node ../contract/gen.mjs --check
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
      # wrangler dev with a local D1 and a fake host; no secrets.
      - name: Bot guests e2e
        if: needs.changes.outputs.heavy == 'true'
        run: npm run e2e:bot

  # THIRD_PARTY_NOTICES.md is generated; fail when it is stale or a shipped license is unsafe to sell with Kith
  # (scripts/notices/policy.json, docs/open-source.md).
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            serve/cloud/package-lock.json
            serve/relay/package-lock.json
            apps/ios/Kit/Mermaid/package-lock.json
      # The npm licenses are read from node_modules; scripts stay off, nothing is built.
      - name: Install npm dependencies
        run: |
          for d in apps/desktop serve/cloud serve/relay apps/ios/Kit/Mermaid; do
            npm ci --prefix "$d" --ignore-scripts --no-audit --no-fund
          done
      - name: Notices generator tests
        run: node --test scripts/notices/generate.test.mjs
      - name: Notices are current and licenses pass the policy
        run: node scripts/notices/generate.mjs --check
      - name: The iOS app's mermaid.js is the pinned package's
        run: cmp apps/ios/Kit/Mermaid/node_modules/mermaid/dist/mermaid.min.js apps/ios/Kit/Sources/KithUI/Resources/Mermaid/mermaid.min.js

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: serve/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serve/relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/dd/SourcePackages
          key: ${{ runner.os }}-ios-packages-${{ hashFiles('apps/ios/Kit/Package.swift', 'apps/Kith.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # The project is committed (xcodegen output), so there is nothing to generate.
      - name: Build iOS Dev for the simulator
        run: >-
          xcodebuild build
          -project apps/Kith.xcodeproj
          -scheme "iOS Dev"
          -configuration DevDebug
          -derivedDataPath build/dd
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      # rustup reads serve/rust-toolchain.toml from here; tools/native-host.mjs builds with it.
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: desktop-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native pieces
        run: |
          mkdir -p build/native
          # SF Symbols masks and the DMG background are generated at build time, never committed.
          npm run icons
          swift ../packaging/dmg/background.swift build/dmg-background.tiff
      - name: Build the Mac app (unsigned, not notarized)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # The runner's toolchain has only its own target; release.yml builds the universal app.
          KITH_HOST_NATIVE_ONLY: "1"
        run: npm run dist:mac -- --arm64 --publish never -c.mac.notarize=false
      - name: Show the result
        run: ls -la dist

  # Typecheck and unit tests of the desktop's TypeScript: nothing in them is macOS-only.
  desktop-js:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # The desktop's relay client against a real kith-serve and wrangler dev (owner, then an invitee). Linux: cheaper than
  # the Mac runner, and nothing in it is macOS-only.
  desktop-relay-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            serve/cloud/package-lock.json
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: desktop-relay-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --manifest-path serve/host/Cargo.toml --bin kith-serve
      - run: npm --prefix serve/cloud ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --ignore-scripts --no-audit --no-fund
      - name: Relay e2e (real host)
        working-directory: apps/desktop
        env:
          KITH_SERVE_HOST_BIN: ${{ github.workspace }}/serve/host/target/debug/kith-serve
        run: npm run e2e:relay:host

  # Bot guests, end to end: the real kith-guest binary joins and asks through wrangler dev and a real kith-serve with a
  # stub agent (the desktop relay e2e's harness, plus the bot stage that runs when KITH_GUEST_BIN is set).
  bot-guests-e2e:
    needs: changes
    if: needs.changes.outputs.bot_e2e == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: bot-guests-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --manifest-path serve/host/Cargo.toml --bin kith-serve
      - run: cargo build --manifest-path serve/host/Cargo.toml -p kith-guest
      - run: npm --prefix serve/cloud ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --ignore-scripts --no-audit --no-fund
      - name: Bot guests e2e (real host, real kith-guest)
        working-directory: apps/desktop
        env:
          KITH_SERVE_HOST_BIN: ${{ github.workspace }}/serve/host/target/debug/kith-serve
          KITH_GUEST_BIN: ${{ github.workspace }}/serve/host/target/debug/kith-guest
        run: npm run e2e:relay:host

  # The Linux client for cloud-bot VMs: static musl build per CPU on a native runner (no qemu), then the one-command
  # installer against the tarball it just built. Mirrors release.yml's build-guest without publishing anything.
  guest-linux:
    needs: changes
    if: needs.changes.outputs.guest_linux == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { arch: aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Rust + zig
        run: |
          cd serve
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang cargo-zigbuild
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      # Only main saves the cache: PR refs can't share caches, so their saves just evict main's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: guest-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cd serve/host && cargo zigbuild --release --locked -p kith-guest --target ${{ matrix.target }}
      - name: Static check
        run: |
          f=serve/host/target/${{ matrix.target }}/release/kith-guest
          file "$f"
          file "$f" | grep -qE 'statically linked|static-pie'
      - name: No aws-lc, openssl or native-tls in the client
        run: |
          cd serve/host
          if cargo tree -p kith-guest -e normal | grep -E 'aws-lc|openssl|native-tls'; then exit 1; fi
      - name: Pack
        run: scripts/package-guest.sh 0.0.0-ci ${{ matrix.arch }} serve/host/target/${{ matrix.target }}/release/kith-guest dist
      - name: Install from the tarball and smoke test
        run: |
          KITH_GUEST_PREFIX="$RUNNER_TEMP/prefix" KITH_INSTALL_TARBALL="$(echo dist/*.tar.gz)" sh scripts/install-guest.sh
          # Running it again upgrades in place.
          KITH_GUEST_PREFIX="$RUNNER_TEMP/prefix" KITH_INSTALL_TARBALL="$(echo dist/*.tar.gz)" sh scripts/install-guest.sh
          scripts/smoke-guest.sh "$RUNNER_TEMP/prefix/bin/kith"

  # The single check to require: passes when every needed job passed or was
  # skipped by the filter, fails on any failure or cancellation.
  # Skipped when the run itself is cancelled (a re-push superseded it), so it reports no failing `ci`. A job cancelled or timed out inside a live run still fails it through RESULTS.
  ci:
    if: ${{ !cancelled() && inputs.mode != 'check' }}
    needs: [changes, kernel, host, windows, host-build, host-test, host-kernel, host-kernel-check, host-e2e, host-crates, cloud, licenses, thread-writers, revoke-access, secret-cards, relay, ios, desktop, desktop-js, desktop-relay-e2e, bot-guests-e2e, guest-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  # Light Rust check, by hand only (never on push or pull_request): fmt, clippy -D warnings and tests of chosen
  # packages on Linux, Windows and macOS, instead of building on your Mac. Every other job is skipped in this mode.
  #
  # How to use (GitHub only dispatches workflow files that exist on main, so this lives in ci.yml, and --ref makes
  # the run use the branch's copy of the file, inputs included):
  #   push your branch to origin
  #   gh workflow run ci.yml --repo Ying-Kai-Liao/kith --ref <branch> -f mode=check -f packages="kith-holder kith-core" -f os=all
  #   gh run list --repo Ying-Kai-Liao/kith --workflow ci.yml --branch <branch> --limit 1   # the run id
  #   gh run watch <run-id> --repo Ying-Kai-Liao/kith --exit-status
  # Add -f artifact=true to also get the built `kith` binary (from each runner that was asked for):
  #   gh run download <run-id> --repo Ying-Kai-Liao/kith -n kith-linux -D /tmp/kith-bin   # or kith-macos, kith-windows
  #   chmod +x /tmp/kith-bin/kith && kernel/tests/difftest/kith-difftest --rust --bin /tmp/kith-bin/kith
  # packages: names as in `cargo -p`. Every Rust crate here is in the serve/host workspace (core/* are out-of-tree
  # members of it), so one manifest serves all. Empty fails fast. os: all | linux | windows | macos.
  rust-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
    name: rust-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    defaults:
      run:
        shell: bash
        working-directory: serve/host
    env:
      PACKAGES: ${{ inputs.packages }}
    steps:
      - name: Require packages
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$(echo "$PACKAGES" | tr -d '[:space:]')" ]; then
            echo "::error::mode=check needs -f packages=\"<cargo package names>\" (for example kith-holder)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: rust-check-${{ matrix.os }}
      - name: Select packages
        run: |
          sel=""
          for p in $PACKAGES; do
            sel="$sel -p $p"
          done
          echo "SEL=$sel" >> "$GITHUB_ENV"
      - name: fmt
        run: cargo fmt --check $SEL
      - name: clippy
        run: cargo clippy $SEL --all-targets --locked -- -D warnings
      - name: test
        run: cargo test $SEL --locked --no-fail-fast
      - name: Build kith
        if: inputs.artifact
        run: cargo build --locked -p kith-serve --bin kith
      - name: Upload kith
        if: inputs.artifact
        uses: actions/upload-artifact@v4
        with:
          name: kith-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}
          path: serve/host/target/debug/kith${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 3
