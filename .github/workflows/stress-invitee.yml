# Throwaway (devops, 2026-11-28): repeats host-e2e shard 1/3 to catch permission_mode_e2e's lost invitee turn with its
# probe dump. Lives only on the devops/stress-invitee-bypass branch; never merged.
name: stress-invitee
on:
  push:
    branches: [devops/stress-invitee-bypass]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: host-linux-test
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - working-directory: serve/host
        run: cargo nextest archive --workspace --exclude kith-guest --exclude kith-tts --archive-file "$RUNNER_TEMP/host-tests.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: host-tests
          path: ${{ runner.temp }}/host-tests.tar.zst
          retention-days: 1
          compression-level: 0
  stress:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - uses: actions/download-artifact@v4
        with:
          name: host-tests
          path: ${{ runner.temp }}
      - name: Shard 1/3, five times
        working-directory: serve/host
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::iteration $i"
            cargo nextest run --profile ci --no-fail-fast \
              --archive-file "$RUNNER_TEMP/host-tests.tar.zst" --extract-to . --extract-overwrite --workspace-remap . \
              -E 'kind(test) and not binary(schedules_cutover_e2e)' --partition count:1/3 2>&1 | tee "$RUNNER_TEMP/iter$i.log" | grep -E "FAIL|SLOW|Summary|PROBE" || true
            echo "::endgroup::"
            grep -E "(PASS|FAIL) .*an_invitees_run_never_starts_in_bypass" "$RUNNER_TEMP/iter$i.log" | sed 's/\x1b\[[0-9;]*m//g' | sed "s/^/iter $i: /" || true
          done
      - if: always()
        run: mkdir -p out && cp "$RUNNER_TEMP"/iter*.log out/ && cp /tmp/probe-host-*.log out/ 2>/dev/null; ls out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ matrix.job }}
          path: out
          retention-days: 3
