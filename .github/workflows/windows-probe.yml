# One-off facts probe: what real Claude Code does on Windows (hook shell, quoting, PowerShell tool, sandbox, project
# folder names, Git Bash). Runs real Claude Code against kith-fakemodel with a dummy key, so it needs no secret.
# The output is written up by hand as docs/windows-facts.md; this workflow only produces the evidence.
name: windows-probe

on:
  pull_request:
    paths:
      - .github/workflows/windows-probe.yml
      - serve/host/tests/support/fakemodel/**
      - serve/host/tests/support/winprobe/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: winprobe
      - name: Build kith-fakemodel
        shell: bash
        working-directory: serve
        run: cargo build --manifest-path host/Cargo.toml -p kith-fakemodel --locked
      - name: Probe Claude Code (npm and install.ps1)
        shell: pwsh
        timeout-minutes: 14
        run: >
          ./serve/host/tests/support/winprobe/probe.ps1
          -Fakemodel "$env:GITHUB_WORKSPACE/serve/host/target/debug/kith-fakemodel.exe"
          -Out "$env:GITHUB_WORKSPACE/probe-out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-probe-output
          path: probe-out
          if-no-files-found: warn
