# One-off facts probe: what real Claude Code does on Windows (hook shell, quoting, PowerShell tool, sandbox, project
# folder names, Git Bash). Runs real Claude Code against kith-fakemodel with a dummy key, so it needs no secret.
# The output is written up by hand as docs/windows-facts.md; this workflow only produces the evidence.
name: windows-probe

on:
  pull_request:
    paths:
      - .github/workflows/windows-probe.yml
      - serve/host/tests/support/fakemodel/**
      - serve/host/tests/support/winprobe/**
  workflow_dispatch:
    inputs:
      parts:
        description: 'guest2 parts: all, or u (only variant U)'
        default: all

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: winprobe
      - name: Build kith-fakemodel
        shell: bash
        working-directory: serve
        run: cargo build --manifest-path host/Cargo.toml -p kith-fakemodel --locked
      - name: Probe Claude Code (npm and install.ps1)
        shell: pwsh
        timeout-minutes: 14
        run: >
          ./serve/host/tests/support/winprobe/probe.ps1
          -Fakemodel "$env:GITHUB_WORKSPACE/serve/host/target/debug/kith-fakemodel.exe"
          -Out "$env:GITHUB_WORKSPACE/probe-out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-probe-output
          path: probe-out
          if-no-files-found: warn

  # W20: what a Windows guest sandbox (kith's own AppContainer box) can rest on. Runs the OS probes as a STANDARD local user
  # (runneradmin is an Administrator; the target machine's user is not), then the Claude Code probes. Evidence only: the
  # write-up is docs/windows-facts.md F11 onward.
  guest:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: winprobe-guest
      - name: Build kith-fakemodel and boxprobe
        shell: bash
        working-directory: serve
        run: cargo build --manifest-path host/Cargo.toml -p kith-fakemodel -p kith-boxprobe --locked
      - name: Guest box probe (OS premises, as a standard user)
        shell: pwsh
        timeout-minutes: 40
        run: >
          ./serve/host/tests/support/winprobe/guest.ps1
          -Boxprobe "$env:GITHUB_WORKSPACE/serve/host/target/debug/boxprobe.exe"
          -Out "$env:GITHUB_WORKSPACE/guest-out"
      - name: Guest Claude Code probe (bash path, permission rules, sandbox)
        if: always()
        shell: pwsh
        timeout-minutes: 25
        run: >
          ./serve/host/tests/support/winprobe/guest-claude.ps1
          -Fakemodel "$env:GITHUB_WORKSPACE/serve/host/target/debug/kith-fakemodel.exe"
          -Boxprobe "$env:GITHUB_WORKSPACE/serve/host/target/debug/boxprobe.exe"
          -Out "$env:GITHUB_WORKSPACE/guest-out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-guest-probe-output
          path: guest-out
          if-no-files-found: warn

  # W20b: guest box probe round 2. Variant A (AppContainer) against variant R (restricted token in a job), as the same standard
  # user; the pinned PortableGit and busybox-w32; the G10 admin steps (python grant, loopback exemption, firewall filters).
  # Evidence only: the write-up is docs/windows-facts.md F24 onward.
  guest2:
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        working-directory: serve
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serve/host
          shared-key: winprobe-guest
      - name: Build boxprobe
        shell: bash
        working-directory: serve
        run: cargo build --manifest-path host/Cargo.toml -p kith-boxprobe --locked
      - name: Build boxprobe with the raw WFP filters (a failure here only skips P-G14's raw-filter part)
        continue-on-error: true
        shell: bash
        working-directory: serve
        run: cargo build --manifest-path host/Cargo.toml -p kith-boxprobe --features kith-boxprobe/wfp --locked
      - name: Guest box probe round 2 (A against R, as a standard user)
        shell: pwsh
        timeout-minutes: 75
        run: >
          ./serve/host/tests/support/winprobe/guest2.ps1
          -Boxprobe "$env:GITHUB_WORKSPACE/serve/host/target/debug/boxprobe.exe"
          -Out "$env:GITHUB_WORKSPACE/guest2-out"
          -Parts "${{ inputs.parts || 'all' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-guest2-probe-output
          path: guest2-out
          if-no-files-found: warn
