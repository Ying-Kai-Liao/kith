\* M3-0a: open question s.11 Q2 (an idle warm process when a terminal turn arrives), decided default: kill it first.
\* keepidle: the round-4 "fix" design (keep the idle process: only the lock and the hash check guard it); P7 must FAIL, which shows the check is not vacuous
SPECIFICATION Spec
CONSTANTS
  Variant = "fix"
  HMode = "survive"
  Directs = {d1}
  d1 = d1
  MaxTurns = 2
  MaxCoreCrash = 1
  MaxHolderCrash = 1
  MaxRevoke = 1
  MaxTakeOver = 1
  MaxChild = 1
INVARIANTS TypeOK P1_NoTwoWriters P2_NoLostTurn P4_GoneMeansEmpty P5_StaleNeverPrompted P6_LockFileNeverDeleted P7_NoWarmBesideRegisteredTerminal
CHECK_DEADLOCK FALSE
