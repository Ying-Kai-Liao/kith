\* Holder.tla: the redeem write but an unlisted running claim is released straight to ended (no ending, no pid check): DoneTruth fails.
SPECIFICATION Spec
CONSTANTS
  MaxClaim = 3
  MaxInst = 2
  MaxPid = 3
  MaxGen = 3
  StaleSends = TRUE
  RefuseOlder = TRUE
  HighWater = TRUE
  RefuseWhileRunning = FALSE
  KeyByInstance = TRUE
  RecordAtSpawn = TRUE
  WriterLock = TRUE
  RedeemChecksClaim = TRUE
  HolderCrash = TRUE
  RedeemWrite = TRUE
  RedeemCAS = TRUE
  HoldRunning = FALSE
INVARIANTS
  OneWriter
  RunOnce
  DoneTruth
