# Used by CI (`cargo nextest run --profile ci`). Each test runs in its own process; the e2e tests spawn a real
# kith-serve and python fixtures, so a hung one is killed after five minutes instead of at the job timeout.
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The Windows job (W2b): the same, with a short kill so a test that hangs there (a Unix-only wait) cannot eat the job's budget.
[profile.ci-windows]
inherits = "ci"
slow-timeout = { period = "30s", terminate-after = 2 }
