[package]
name = "kith-serve"
version = "0.1.0"
edition = "2024"
# let-chains (`if let … && let …`) need 1.88.
rust-version = "1.88"
default-run = "kith"
description = "Runs your coding-agent bots and serves the Kith apps"
license = "FSL-1.1-MIT"
repository = "https://github.com/leepokai/Kith"

# One program, two names: `kith` is the command (kith serve ..., or the kernel's commands); `kith-serve` is the
# host alone, the name the launchd job and the apps already use. Same source, so both stay in step.
[[bin]]
name = "kith"
path = "src/main.rs"

[[bin]]
name = "kith-serve"
path = "src/main.rs"

# The memory crate builds here and is mirrored to its own repository (docs/design/bot-memory.md#packaging).
[workspace]
members = ["crates/memory", "crates/tts", "crates/wire", "crates/guest"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
kith-mem = { path = "crates/memory" }
kith-wire = { path = "crates/wire" }
clap = { version = "4.6.7", features = ["derive", "env"] }
croner = "3"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
flate2 = "1.1.10"
fs2 = "0.4.3"
futures = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4"
hkdf = "0.13.0"
if-addrs = "0.15.0"
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
hmac = "0.13.0"
shlex = "2.0.1"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1.26.1", features = ["v4"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

# rust-skills lint-* rules: all default groups plus pedantic, with the
# library-oriented pedantic lints turned off for this binary crate.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# perf-release-profile / opt-lto-release. Unwinding stays on: a panic in one
# bot's task must not take down the whole daemon.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The host the Kith desktop app bundles (apps/desktop/tools/native-host.mjs): optimized like a release, but
# a host change rebuilds in about 25 s instead of 80 s per architecture.
[profile.dev-app]
inherits = "release"
lto = false
codegen-units = 16
incremental = true


[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
