name = "kith-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The top level is only what the tests and `wrangler dev` run on (a local D1, no routes, no Clerk instance).
# Nothing deploys from it: use `wrangler deploy --env kith` or `--env kith-dev`.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ComputerRelay"]

[vars]
CLERK_ISSUER = "https://clerk.invalid"

[[d1_databases]]
binding = "DB"
database_name = "kith-local"
database_id = "local"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "ComputerRelay"

# New computers per IP (POST /v1/host/register).
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Credential issuance per account; separate from registration limits.
[[ratelimits]]
name = "TURN_LIMITER"
namespace_id = "1011"
simple = { limit = 12, period = 60 }

# Public routine webhook deliveries per sender IP and hook (POST /v1/hooks/...).
[[ratelimits]]
name = "HOOK_LIMITER"
namespace_id = "1021"
simple = { limit = 60, period = 60 }

# Bot invite accepts per client IP (POST /v1/bot-invites/:id/accept).
[[ratelimits]]
name = "BOT_JOIN_LIMITER"
namespace_id = "1031"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["*/15 * * * *"]

# local: wrangler dev / e2e with a local D1; CLERK_JWT_KEY is injected by the test (--var).
[env.local]
name = "kith-cloud-local"
routes = []
vars = { CLERK_ISSUER = "https://clerk.test.local" }
d1_databases = [{ binding = "DB", database_name = "kith-local", database_id = "local", migrations_dir = "migrations" }]
durable_objects.bindings = [{ name = "RELAY", class_name = "ComputerRelay" }]
ratelimits = [{ name = "REGISTER_LIMITER", namespace_id = "1003", simple = { limit = 10, period = 60 } }, { name = "TURN_LIMITER", namespace_id = "1013", simple = { limit = 12, period = 60 } }, { name = "HOOK_LIMITER", namespace_id = "1023", simple = { limit = 60, period = 60 } }, { name = "BOT_JOIN_LIMITER", namespace_id = "1033", simple = { limit = 10, period = 60 } }]

# kith: Kith's production cloud with accounts (own Clerk application, own D1). Setup steps: README.md, "Kith accounts".
# CLERK_SECRET_KEY and CLERK_WEBHOOK_SECRET are secrets (`wrangler secret put ... --env kith`),
# never written here. Until they are set the account routes answer 401 and QR pairing still works.
[env.kith]
name = "kith-cloud"
routes = [{ pattern = "api.kithbot.app", custom_domain = true }, { pattern = "kithbot.app", custom_domain = true }]
workers_dev = false
vars = { CLERK_ISSUER = "https://clerk.kithbot.app" }
d1_databases = [{ binding = "DB", database_name = "kith", database_id = "1afedb14-ed5c-488c-af33-901e9aa0d123", migrations_dir = "migrations" }]
durable_objects.bindings = [{ name = "RELAY", class_name = "ComputerRelay" }]
ratelimits = [{ name = "REGISTER_LIMITER", namespace_id = "2001", simple = { limit = 10, period = 60 } }, { name = "TURN_LIMITER", namespace_id = "2011", simple = { limit = 12, period = 60 } }, { name = "HOOK_LIMITER", namespace_id = "2021", simple = { limit = 60, period = 60 } }, { name = "BOT_JOIN_LIMITER", namespace_id = "2031", simple = { limit = 10, period = 60 } }]
triggers = { crons = ["*/15 * * * *"] }

# kith-dev: Kith's own relay for every local build, on our Cloudflare account at workers.dev (no custom domain).
# Accounts use the Kith Clerk development instance. Until CLERK_SECRET_KEY and CLERK_WEBHOOK_SECRET are set on
# this worker, the account routes answer 401 and the webhook answers an internal error; QR pairing works either way.
[env.kith-dev]
name = "kith-cloud-dev"
routes = []
workers_dev = true
vars = { CLERK_ISSUER = "https://adjusted-starfish-4735.clerk.accounts.dev", WEB_ORIGINS = "https://kith-web-dev.lykevin890919.workers.dev" }
d1_databases = [{ binding = "DB", database_name = "kith-dev", database_id = "f8912768-50ee-45b0-a2b0-320ab8468afe", migrations_dir = "migrations" }]
durable_objects.bindings = [{ name = "RELAY", class_name = "ComputerRelay" }]
ratelimits = [{ name = "REGISTER_LIMITER", namespace_id = "2002", simple = { limit = 10, period = 60 } }, { name = "TURN_LIMITER", namespace_id = "2012", simple = { limit = 12, period = 60 } }, { name = "HOOK_LIMITER", namespace_id = "2022", simple = { limit = 60, period = 60 } }, { name = "BOT_JOIN_LIMITER", namespace_id = "2032", simple = { limit = 10, period = 60 } }]
triggers = { crons = ["*/15 * * * *"] }
